minio:
  # For production use set this to "distributed" and set the replicas to 4 or more.
  mode: standalone

  # Default is 16 nodes but we set to 2 (the minimum) for testing purposes.  
  # replicas: 4
  resources:
    requests:
      # For production use the 
      memory: "4Gi"  
  ingress:
    enabled: true
    #annotations:
    #  kubernetes.io/ingress.class: nginx
    path: /
    hosts:
      - minio.lab.$DOMAIN
    tls:
      - hosts:
          - minio.lab.$DOMAIN
  consoleIngress:
    enabled: true
    #annotations:
    #  kubernetes.io/ingress.class: nginx
    paths: /
    hosts:
      - minio-console.lab.$DOMAIN
    tls:
      - hosts:
          - minio-console.lab.$DOMAIN
  persistence:
    size: 10Gi
  environment:
    MINIO_BROWSER_REDIRECT_URL: https://minio-console.lab.$DOMAIN
  oidc:
    enabled: true
    configUrl: "https://auth.lab.$DOMAIN/realms/datalab/.well-known/openid-configuration"
    clientId: "minio"
    claimName: "minio-policy"
    scopes: "openid,profile,email"
    redirectUri: "https://minio-console.lab.$DOMAIN/oauth_callback"
    clientSecret: $KEYCLOAK_MINIO_CLIENT_SECRET
  policies:
    - name: stsonly
      statements:
        - resources:
            - 'arn:aws:s3:::user-${jwt:onyxia-username}'
            - 'arn:aws:s3:::user-${jwt:onyxia-username}/*'
          actions:
            - "s3:*"
