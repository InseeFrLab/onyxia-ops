onyxia:
  ingress:
    enabled: true
    #ingressClassName: nginx
    hosts:
      - host: datalab.$DOMAIN
  web:
    env:
      S3: |
        {
          URL: "https://minio.lab.$DOMAIN",
          sts: {
              role: {
                profileName: "default",
                roleARN: "",
                roleSessionName: ""
              },
              oidcConfiguration: {
                issuerURI: "https://auth.lab.$DOMAIN/realms/datalab",
                clientID: "onyxia"
              }
          },
          bookmarks: [
              {
                s3Uri: "s3://user-$1/",
                title: { fr: "Bucket Personnel", en: "Personal Bucket" },
                claimName: "onyxia-username"
              }
          ]
        }
  api:
    enabled: false
